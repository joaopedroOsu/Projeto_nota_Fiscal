 <main class="pfundocad">

<form action="php/insert_cliente.php" method="post">
   <p class="pp">CADASTRAR CLIENTE!!!</p>
    <label for="cnpj">Número do CNPJ</label>
    <input type="text" name="cnpj" id="cnpj" maxlength="14" required>

    <label for="razao">Razão Social</label>
    <input type="text" name="razao" id="razao" required>

    <label for="pais">Pais</label>

    <div class="button">
        <button type="submit"><strong>Cadastrar</strong></button>
    </div>

    <div class="button">
        <button type="button" onclick="window.location.href='/home.html'"><strong>Menu</strong></button>

</form>
