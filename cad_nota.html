<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Nota</title>
    <link rel="stylesheet" href="css/cad_nota.css">
</head>
<body>

 <main class="pfundocad">
<DIV class="IMGLADOCADUNI">
<img src="/img/mode-fruits@2x.png" height="540px" alt="">
    </DIV>

<form action="php/insert_nota.php" method="post">
   <p class="pp">CADASTRAR NOTA!!!</p>
    <label for="dt_emissao">Data de Emissão</label>
    <input type="date" name="dt_emissao" id="dt_emissao" required>

    <label for="dt_envio">Data de Envio</label>
    <input type="date" name="dt_envio" id="dt_envio" required>

    <label for="cnpj">CNPJ</label>
    <input type="text" name="cnpj" id="cnpj" maxlength="14" required>

    <label for="vl_total">Valor Total</label>
    <input type="text" name="vl_total" id="vl_total" required>

    <div class="button">
        <button type="submit"><strong>Cadastrar</strong></button>
    </div>

    <div class="button">
        <button type="button" onclick="window.location.href='/home.html'"><strong>Menu</strong></button>
    </div>

</form>

    </main>

</body>
</html>
